<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mindriftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="50%" stop-color="#805AD5" />
      <stop offset="100%" stop-color="#4FA3E0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="112" fill="#0B0F19" />
  <!-- Vibrant Gradient Shape -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="url(#mindriftGrad)" opacity="0.12" />
  
  <!-- Mindrift Compass / Progress Ring Geometry -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#mindriftGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="140" filter="url(#glow)" />
  
  <!-- Inner Dynamic Spark & Pointer -->
  <path d="M256 120 L290 222 L392 256 L290 290 L256 392 L222 290 L120 256 L222 222 Z" fill="url(#mindriftGrad)" />
  <circle cx="256" cy="256" r="32" fill="#FFFFFF" />
</svg>
